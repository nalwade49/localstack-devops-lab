version: "3.8"

services:
  localstack:
    image: localstack/localstack:4.4.0
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - DEBUG=1
      - ENFORCE_IAM=1
      - IAM_SOFT_MODE=1
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
