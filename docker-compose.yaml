services:
  localstack:
    image: localstack/localstack:4.4.0
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=ec2,s3,iam,vpc,lambda
      - DEBUG=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./init-scripts:/etc/localstack/init/ready.d
